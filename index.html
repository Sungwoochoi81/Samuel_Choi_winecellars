<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ecebe8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121010" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192-v3.png">
<link rel="apple-touch-icon" href="icon-192-v3.png">
<title>Ma Cave</title>
<style>
@font-face{font-family:'Marcellus';font-weight:400;font-style:normal;font-display:swap;src:url('Marcellus-ext.woff2') format('woff2');unicode-range:U+0100-02AF,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20CF,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Marcellus';font-weight:400;font-style:normal;font-display:swap;src:url('Marcellus.woff2') format('woff2');unicode-range:U+0000-002F,U+003A-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Pretendard Variable';font-weight:45 920;font-style:normal;font-display:swap;src:url('PretendardVariable.woff2') format('woff2-variations')}
/* Layout idea: a cellar ledger. Each lot is a row with a style-coloured capsule stripe on the left,
   the vintage set large in the display face, and the bottle count on the right. Sheets slide up for all editing. */
:root{
  --bg:#ecebe8; --surface:#fcfbf9; --ink:#1d1917; --muted:#6b655f; --line:#d8d3cb; --accent:#6b1d33; --on-accent:#fff; --card-a:#1e1a18; --card-b:#2a2421; --card-ink:#f3ede0; --gold:#c9aa6a; --gold-ink:#83652a; --wine:#1e1a18; --on-wine:#f6f1e7;
  --good:#2f7d55; --warn:#a8691a; --bad:#a43a3a;
  --s-red:#8e2440; --s-white:#c8a640; --s-spark:#6f9fb5; --s-rose:#d98a94; --s-rosechamp:#e98f86; --s-dessert:#b4701f; --s-fort:#5b3a2a;
  --display:'Marcellus','Pretendard Variable',Pretendard,system-ui,-apple-system,'Malgun Gothic',sans-serif;
  --body:'Pretendard Variable',Pretendard,system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121010; --surface:#1b1816; --ink:#ece6dc; --muted:#a39c93; --line:#332e2a; --accent:#d8bb80; --on-accent:#1a1410; --card-a:#221d1a; --card-b:#2d2622; --card-ink:#f3ede0; --gold:#d8bb80; --gold-ink:#d8bb80; --wine:#e9e2d5; --on-wine:#1a1614;
    --good:#6cc596; --warn:#e0a653; --bad:#e58080;
    --s-red:#c0456a; --s-white:#d9bd5f; --s-spark:#8dbcd0; --s-rose:#e7a3ac; --s-rosechamp:#f2a79f; --s-dessert:#d08e3c; --s-fort:#9a6f58;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121010; --surface:#1b1816; --ink:#ece6dc; --muted:#a39c93; --line:#332e2a; --accent:#d8bb80; --on-accent:#1a1410; --card-a:#221d1a; --card-b:#2d2622; --card-ink:#f3ede0; --gold:#d8bb80; --gold-ink:#d8bb80; --wine:#e9e2d5; --on-wine:#1a1614;
  --good:#6cc596; --warn:#e0a653; --bad:#e58080;
  --s-red:#c0456a; --s-white:#d9bd5f; --s-spark:#8dbcd0; --s-rose:#e7a3ac; --s-rosechamp:#f2a79f; --s-dessert:#d08e3c; --s-fort:#9a6f58;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
h1{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em;margin:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:10px 14px;font-weight:500;min-height:44px}
.btn.primary{background:var(--wine);border-color:var(--wine);color:var(--on-wine);font-weight:600}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn.small{min-height:36px;padding:6px 10px;font-size:13px}

#banner{cursor:pointer;margin:0 16px 8px;padding:8px 12px;border-radius:2px;background:color-mix(in srgb,var(--warn) 16%,var(--surface));font-size:13px}
main{flex:1;overflow-y:auto;padding:0 16px 20px;min-height:0}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

.tools{display:flex;flex-direction:column;gap:8px}
.tools input[type=search],.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:10px 12px;font-size:16px;min-height:44px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:2px;padding:6px 12px;font-size:13px;min-height:36px;display:flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sgl{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.row4{display:grid;grid-template-columns:1fr 1fr 1fr 1.35fr;gap:6px}
.row4 select{min-width:0;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:8px 2px 8px 8px;font-size:13px;min-height:40px;text-overflow:ellipsis}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row2 select{flex:1 1 30%;min-width:104px;border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:8px 10px;font-size:14px;min-height:40px}
.ask{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:4px 12px;margin:0;min-width:0;display:flex;flex-direction:column}
.field .ask label{display:flex;align-items:center;gap:8px;min-height:38px;font-size:15px;color:var(--ink);font-weight:400}
.ask input{width:18px;height:18px;min-height:0;padding:0;margin:0;flex:none;accent-color:var(--accent)}
.ask label+label{border-top:1px solid var(--line)}
.check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.countrow{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:24px}
.countrow .check{font-size:12px;margin-left:auto}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.list{display:flex;flex-direction:column;gap:8px}
.wine{display:flex;align-items:stretch;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0;overflow:hidden}
.stripe{width:6px;flex:none}
.w-vint{font-family:var(--display);font-weight:700;font-size:22px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;flex:none;width:52px;padding:14px 0 0;color:var(--ink)}
.w-vint.nv{font-size:16px;color:var(--muted)}
.w-main{flex:1;min-width:0;padding:12px 0;display:flex;flex-direction:column;gap:3px}
.w-name{font-weight:600;overflow-wrap:anywhere}
.w-sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.w-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;margin-top:2px}
.w-qty{flex:none;padding:12px 14px 12px 0;text-align:right;font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.w-qty small{font-family:var(--body);font-weight:400;font-size:11px;color:var(--muted);display:block}
.wine.empty{opacity:.55}
.pill{border-radius:2px;padding:2px 8px;font-size:11px;font-weight:600;border:1px solid currentColor;white-space:nowrap;flex:none}
.pill.ai{color:var(--accent)} .pill.now{color:var(--good)} .pill.wait{color:var(--warn)} .pill.late{color:var(--bad)}
.price{color:var(--muted);font-variant-numeric:tabular-nums}

.blank{background:var(--surface);border:1px dashed var(--line);border-radius:4px;padding:28px 18px;text-align:center;color:var(--muted)}
.blank strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.log.has-ph{position:relative;padding-right:78px;min-height:76px}
.log-ph{position:absolute;right:10px;top:10px;width:56px;height:56px;border-radius:3px;object-fit:cover}
.log{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;text-align:left;width:100%;display:flex;flex-direction:column;gap:3px}
.log-top{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.log-note{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.score{font-family:var(--display);font-weight:700;color:var(--gold-ink)}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px}
.tile b{display:block;font-family:var(--display);font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile span{font-size:12px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px}
.ch-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.ch-head h2{margin:0}
.seg{display:flex;border:1px solid var(--line);border-radius:2px;padding:2px;background:var(--bg)}
.seg button{border:0;background:none;border-radius:2px;padding:5px 12px;font-size:12px;min-height:30px;color:var(--muted);font-weight:600}
.viewsw{align-self:center;width:100%;max-width:280px}
.seg a{flex:1;text-align:center;text-decoration:none;border-radius:2px;padding:7px 12px;font-size:13px;color:var(--muted);font-weight:600}
.seg a[aria-current=page]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.ch-read{margin:0 0 6px;font-size:13px;color:var(--muted);min-height:20px;font-variant-numeric:tabular-nums}
.ch-read b{color:var(--ink)}
.ch-plot{display:flex;align-items:stretch;gap:2px;height:136px;border-bottom:1px solid var(--line)}
.ch-col{flex:1;min-width:0;border:0;background:none;padding:0 1px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px}
.ch-val{flex:none;height:14px;line-height:14px;font-size:10.5px;color:var(--ink);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.ch-area{flex:1;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center}
.ch-bar{display:block;width:100%;max-width:22px;background:var(--accent);border-radius:4px 4px 0 0;opacity:.82}
.ch-col:hover .ch-bar,.ch-col.on .ch-bar{opacity:1}
.ch-col.on{background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:6px 6px 0 0}
.ch-x{display:flex;gap:2px;margin-top:3px}
.ch-x span{flex:1;min-width:0;text-align:center;font-size:10px;color:var(--muted);line-height:1.2;white-space:nowrap}
.ch-x i{display:block;font-style:normal;font-size:9px}
.ch-table{margin-top:8px;font-size:13px}
.ch-table summary{color:var(--muted);font-size:12px;padding:6px 0;cursor:pointer}
.ch-table table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ch-table th,.ch-table td{text-align:right;padding:5px 4px;border-bottom:1px solid var(--line);font-weight:400}
.ch-table th{color:var(--muted);font-size:12px}
.ch-table th:first-child,.ch-table td:first-child{text-align:left}
.panel>h2,.ch-head h2{letter-spacing:-.01em}
.panel h2{font-size:14px;margin:0 0 10px;font-weight:600}
.bar{display:grid;grid-template-columns:92px 1fr 28px;gap:10px;align-items:center;font-size:13px;margin:8px 0}
.bar .trk{display:block;height:6px;border-radius:3px;background:color-mix(in srgb,var(--ink) 7%,transparent);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent);min-width:2px}
.tiles.deep{gap:0;border-radius:4px;overflow:hidden;color:var(--card-ink);background:radial-gradient(110% 130% at 100% 0%,color-mix(in srgb,var(--gold) 30%,transparent) 0%,transparent 55%),linear-gradient(160deg,var(--card-a),var(--card-b));border:1px solid color-mix(in srgb,var(--gold) 28%,transparent);box-shadow:0 12px 26px -16px rgba(0,0,0,.55)}
.tiles.deep .tile{background:none;border:0;border-radius:0;padding:12px 16px;display:flex;flex-direction:column;gap:1px;min-width:0}
.tiles.deep .tile:nth-child(odd){border-right:1px solid rgba(255,255,255,.14)}
.tiles.deep .tile:nth-child(n+3){border-top:1px solid rgba(255,255,255,.14)}
.tiles.deep .tile span{font-size:11px;letter-spacing:.04em;color:var(--gold);font-weight:600}
.tiles.deep .tile b{font-size:20px;font-weight:800;line-height:1.25}
.tiles.deep .tile b small{font-size:13px;font-weight:600;margin-left:2px;opacity:.85}
.tiles.deep .tile b.gold{color:var(--gold)}
.tiles.deep .tile em{font-style:normal;font-size:11px;opacity:.75}
.in-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;font-variant-numeric:tabular-nums}
.in-gh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.in-gh h2{margin:0;overflow-wrap:anywhere}
.in-gh span{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.in-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.in-sub{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.in-qty{flex:none;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.in-qty small{font-size:10px;font-weight:400;color:var(--muted);margin-left:1px}
.rlist{display:flex;flex-direction:column}
.rlist button{display:flex;align-items:center;gap:10px;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;text-align:left;min-height:44px;width:100%}
.rlist button:first-child{border-top:0}
.rlist .rv{flex:none;font-weight:700;font-size:13px;color:var(--gold-ink);font-variant-numeric:tabular-nums;width:36px}
.rlist .rn{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
.panel{border-radius:4px}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}

nav{display:flex;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:12px 4px 14px;text-decoration:none;color:var(--muted);font-size:13px;font-weight:500;border-top:2px solid transparent;margin-top:-1px}
nav a[aria-current=page]{color:var(--accent);border-top-color:var(--accent);font-weight:600}

#sheet{position:fixed;inset:0;background:rgba(8,10,9,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92%;border-radius:10px 10px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 8px}
.sheet-head h2{margin:0;font-size:17px;font-weight:600;overflow-wrap:anywhere}
.x{border:0;background:none;font-size:22px;line-height:1;min-width:44px;min-height:44px;color:var(--muted)}
.sheet-body{overflow-y:auto;padding:4px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field textarea{min-height:96px;resize:vertical}
#f-grape-pick{margin-top:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:120px}
.acts.three .btn{min-width:0;padding-left:8px;padding-right:8px}
.chg{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.chg small{font-size:12px;color:var(--muted);font-weight:600}
.chg .old{color:var(--muted);text-decoration:line-through;overflow-wrap:anywhere;font-size:13px}
.chg .new{font-weight:600;overflow-wrap:anywhere}
.scan{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;z-index:3;flex:none;box-shadow:0 -8px 0 var(--bg),0 8px 14px -10px rgba(0,0,0,.35)}
.scan .hint:has(#scan-status:empty){display:none}
/* 등록·저장 버튼은 화면 아래에 따로 띠로 두어 스크롤과 상관없이 항상 보이게 한다 */
.savebar{grid-column:1/-1;position:sticky;bottom:0;z-index:3;margin:4px -16px 0;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 14px -12px rgba(0,0,0,.4)}
.savebar{display:flex;gap:8px}
.savebar .btn{flex:1.45 1 0;min-width:0;width:auto;padding-left:4px;padding-right:4px;white-space:nowrap}
.savebar .bskip{flex:.7 1 0;background:var(--surface)}
.savebar .next{flex:1 1 0;font-size:13px;font-weight:600;border-color:var(--wine);color:var(--wine);background:var(--surface)}
.savebar .more-cam{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:5px;padding:10px 4px;font-size:13px;white-space:nowrap;background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.savebar .more-cam svg{width:17px;height:17px;flex:none}
.sheet-body:has(.savebar){padding-bottom:0}
.bar5{flex:1;min-width:0;display:flex;gap:6px}
.bar5 .btn{flex:1 1 0;min-width:0;padding:8px 2px;font-size:13px;white-space:nowrap}
.hint{font-size:12px;color:var(--muted);margin:0}
.kv{display:grid;grid-template-columns:84px 1fr;gap:6px 10px;font-size:14px;margin:0}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;overflow-wrap:anywhere}
.about{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:3px;padding:12px;font-size:14px;white-space:pre-wrap}
.about small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px;font-weight:600}
.hero{display:flex;gap:12px;align-items:baseline}
.hero .v{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:-.03em;line-height:1}
a.ext{color:var(--accent);font-size:14px}
/* 결과 알림: 화면 위쪽에 밝은 카드로. 아래쪽 버튼과 저장 띠를 가리지 않는다 */
#toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);z-index:30;width:max-content;max-width:min(calc(100% - 24px),440px);display:flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:10px 14px 10px 10px;font-size:14px;line-height:1.4;box-shadow:0 14px 30px -12px rgba(0,0,0,.38),0 2px 6px rgba(0,0,0,.08);animation:toastIn .22s cubic-bezier(.2,.8,.2,1);cursor:pointer}
#toast .t-ic{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--good) 16%,var(--surface));color:var(--good)}
#toast .t-ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#toast.warn .t-ic{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}

<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STYLES=[['레드','red'],['화이트','white'],['스파클링','spark'],['로제 샴페인','rosechamp'],['로제','rose'],['디저트','dessert'],['주정강화','fort']];
/* 스타일 아이콘: 잔 모양과 와인 색으로 구분한다. 레드·화이트·로제는 같은 잔에 색만 다르고, 스파클링은 플루트, 디저트는 작은 디저트 와인잔, 주정강화는 포트 잔 */
const STYLE_GLASS={
  wine:['M7 3h10l-1 7a4 4 0 0 1-8 0z','M7.45 6.2h9.1l-.55 3.8a4 4 0 0 1-8 0z','M12 14v6M8 21h8'],
  flute:['M9.2 2h5.6l-.6 9.4a2.2 2.2 0 0 1-4.4 0z','M9.5 5.4h5l-.3 6a2.2 2.2 0 0 1-4.4 0z','M12 13.6V20M9 21h6'],
  dessert:['M8.6 5h6.8l-.7 5.4a2.7 2.7 0 0 1-5.4 0z','M8.85 6.8h6.3l-.45 3.6a2.7 2.7 0 0 1-5.4 0z','M12 13.1V20M9 21h6'],
  port:['M8 6h8l-.5 5a3.5 3.5 0 0 1-7 0z','M8.25 8.4h7.5l-.25 2.6a3.5 3.5 0 0 1-7 0z','M12 14.5V18M8.5 20.5h7M12 18v2.5']};
const STYLE_SHAPE={'스파클링':'flute','로제 샴페인':'flute','디저트':'dessert','주정강화':'port'};
function styleIcon(st){
  const g=STYLE_GLASS[STYLE_SHAPE[st]||'wine'];
  return`<svg class="sgl" viewBox="0 0 24 24" aria-hidden="true"><path d="${g[1]}" fill="${st==='스파클링'?'#e2cf7a':st==='로제 샴페인'?'#ef9f97':st==='주정강화'?'#6a2230':styleVar(st)}" stroke="none"/>${st==='스파클링'||st==='로제 샴페인'?'<circle cx="11.3" cy="8.6" r=".7" fill="var(--surface)" stroke="none"/><circle cx="12.8" cy="6.9" r=".6" fill="var(--surface)" stroke="none"/>':''}<path d="${g[0]}"/><path d="${g[2]}"/></svg>`;
}
const styleVar=s=>{const f=STYLES.find(x=>x[0]===s);return f?`var(--s-${f[1]})`:'var(--line)'};
const won=n=>(n||n===0)&&isFinite(n)?Math.round(n).toLocaleString('ko-KR')+'원':'';
const num=v=>{const n=parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return isFinite(n)?n:null};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const YEAR=new Date().getFullYear();
/* 빈티지: 연도 숫자, 논빈티지는 'NV', 멀티 빈티지는 'MV'. 비워 두면 NV로 본다 */
const parseVint=v=>{const t=String(v??'').trim().toUpperCase();if(/^(MV|MULTI)/.test(t))return'MV';if(/^(NV|NON|N\.V)/.test(t))return'NV';const n=num(t);return n&&n>=1000&&n<=2999?Math.round(n):null};
const vintNum=w=>typeof w.vintage==='number'?w.vintage:null;
const title=w=>[w.producer,w.name&&w.name!==w.producer?w.name:''].filter(Boolean).join(' ')||'이름 없는 와인';

let loaded=true;
let wines=[],drinks=[],incoming=[]; /* incoming: 사 두고 도착을 기다리는 와인(입고예정) */
const F={q:'',style:'',country:'',grape:'',band:'',loc:'',state:'',producer:'',wname:'',sort:'recent',empty:false};
function resetF(){Object.assign(F,{q:'',style:'',country:'',grape:'',band:'',loc:'',state:'',producer:'',wname:'',sort:'recent',empty:false})}
/* 생산자·와인명 비교용: 악센트·대소문자·기호 차이는 무시 */
const nkey=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9가-힣]/g,'');
/* 조회 조건은 새로고침(화면을 당겨 내리기)해도 유지한다. 앱을 완전히 닫았다 열면 처음 상태로 돌아간다 */
try{const f=JSON.parse(sessionStorage.getItem('cellar.filter')||'null');if(f&&typeof f==='object')for(const k of Object.keys(F))if(typeof f[k]===typeof F[k])F[k]=f[k]}catch(_){}
function keepFilter(){try{sessionStorage.setItem('cellar.filter',JSON.stringify(F))}catch(_){}}
const LOCS=['삼성셀러','매직쉐프셀러','거실옷장','삼각창고','기타 장소'];
/* 외부창고는 기타 장소로 합쳤다: 예전에 저장된 값도 옮긴다 */
/* 로제 샴페인 분류: 샹파뉴(지역·아펠라시옹·이름 또는 알려진 샴페인 하우스)의 로제는 스파클링·로제 대신 로제 샴페인으로 */
const CHAMP_HOUSE=/krug|dom\s*p[ée]rignon|perrier[\s-]*jou[eë]t|belle\s*[ée]poque|roederer|cristal|selosse|ruinart|billecart|bollinger|taittinger|laurent[\s-]*perrier|mo[eë]t|veuve\s*clicquot|pol\s*roger|gosset|jacquesson|egly[\s-]*ouriet|deutz|henriot|heidsieck|philipponnat|drappier|lanson|pommery|agrapart|larmandier|bereche|b[ée]r[êe]che|savart|prevost|pr[ée]vost|ulysse\s*collin|vilmart|armand\s*de\s*brignac/i;
function isRoseChamp(w){
  if(!['스파클링','로제'].includes(w.style))return false;
  const txt=[w.producer,w.name,w.appellation,w.region].join(' ');
  const champ=/champagne|샹파뉴|샴페인/i.test(txt)||CHAMP_HOUSE.test(txt);
  const rose=w.style==='로제'||/ros[ée]|로제/i.test([w.name,w.appellation].join(' '));
  return champ&&rose;
}
function mergeLocs(){let n=0;for(const w of wines){if(!w)continue;if(isRoseChamp(w)){w.style='로제 샴페인';n++}if(w.location==='외부창고'){w.location='기타 장소';n++}if(w.grape){const g=normGrapes(w.grape);if(g!==w.grape){w.grape=g;n++}}if(w.region){const r=regionEn(w.region);if(r!==w.region){w.region=r;n++}}}return n}
const CURS=['KRW','EUR','USD','JPY'],CUNIT={JPY:100},CSYM={KRW:'₩',EUR:'€',USD:'$',JPY:'¥'};
const COUNTRIES=['프랑스','이탈리아','스페인','미국','독일','포르투갈','호주','뉴질랜드','칠레','아르헨티나','남아공','오스트리아'];
const CLASSES=['Grand Cru','1er Cru','Village','Régionale','DOCG','DOC','Grand Cru Classé','Reserva','Gran Reserva'];
const GRAPES=['Cabernet Sauvignon','Merlot','Pinot Noir','Syrah / Shiraz','Cabernet Franc','Grenache / Garnacha','Mourvèdre / Monastrell','Malbec','Gamay','Petit Verdot','Carignan / Mazuelo','Cinsault','Pinot Meunier','Tannat','Carménère',
 'Sangiovese','Nebbiolo','Barbera','Dolcetto','Montepulciano','Aglianico','Corvina','Primitivo / Zinfandel',"Nero d'Avola",'Negroamaro','Nerello Mascalese','Sagrantino','Lagrein',
 'Tempranillo','Mencía','Graciano','Bobal','Touriga Nacional','Pinotage','Zweigelt','Blaufränkisch',
 'Chardonnay','Sauvignon Blanc','Riesling','Chenin Blanc','Pinot Gris / Pinot Grigio','Pinot Blanc','Gewürztraminer','Viognier','Sémillon','Marsanne','Roussanne','Muscat / Moscato','Aligoté','Melon de Bourgogne','Savagnin','Grenache Blanc',
 'Vermentino','Garganega','Trebbiano','Glera','Cortese','Arneis','Fiano','Greco','Verdicchio',
 'Albariño','Verdejo','Viura / Macabeo','Godello','Xarel·lo','Parellada','Palomino','Pedro Ximénez','Grüner Veltliner','Furmint','Torrontés','Assyrtiko'];
/* 고르는 목록은 저장된 와인에서 많이 쓴 값이 위로 온다 */
function ranked(defs,get){
  const cnt={};
  for(const w of wines){let vs=get(w);if(vs==null||vs==='')continue;if(!Array.isArray(vs))vs=[vs];for(const v of vs)if(v)cnt[v]=(cnt[v]||0)+1}
  return[...new Set([...defs,...Object.keys(cnt)])].map((v,i)=>[v,cnt[v]||0,i]).sort((a,b)=>b[1]-a[1]||a[2]-b[2]).map(x=>x[0]);
}
const grapesOf=w=>String(w.grape||'').split(',').map(x=>x.trim()).filter(Boolean);
/* 품종은 영문으로 통일한다: 한글 표기와 다른 이름(Shiraz, Zinfandel 등)을 목록의 영문 이름으로 바꾼다 */
const GRAPE_KO=[[/^[카까]베르네[소쇼]비[뇽뇨]ㅇ?$/,'Cabernet Sauvignon'],[/^[카까]베르네프랑$/,'Cabernet Franc'],[/^(메를로|멜롯|메를로트|멜로)$/,'Merlot'],[/^피노누아르?$/,'Pinot Noir'],[/^(시라|쉬라|시라즈|쉬라즈)$/,'Syrah / Shiraz'],
 [/^(그르나슈|가르나차|그르나쉬)$/,'Grenache / Garnacha'],[/^(무르베드르|모나스트렐)$/,'Mourvèdre / Monastrell'],[/^말벡$/,'Malbec'],[/^(가메|가메이)$/,'Gamay'],[/^[쁘프뽀][띠티]베르도$/,'Petit Verdot'],[/^(카리냥|까리냥)$/,'Carignan / Mazuelo'],
 [/^(생소|쌩쏘)$/,'Cinsault'],[/^피노(뫼니에|므니에)$/,'Pinot Meunier'],[/^(타나|따나)$/,'Tannat'],[/^(카르메네르|까르메네르)$/,'Carménère'],[/^산지오베[제세]$/,'Sangiovese'],[/^네비올로$/,'Nebbiolo'],[/^바르베라$/,'Barbera'],[/^돌체토$/,'Dolcetto'],
 [/^몬테풀치아노$/,'Montepulciano'],[/^알리아니코$/,'Aglianico'],[/^코르비나$/,'Corvina'],[/^(프리미티보|진판델)$/,'Primitivo / Zinfandel'],[/^네로다볼라$/,"Nero d'Avola"],[/^(템프라니요|뗌쁘라니요|템프라니오)$/,'Tempranillo'],[/^멘시아$/,'Mencía'],
 [/^(투리가나시오날|토우리가나시오날)$/,'Touriga Nacional'],[/^피노타[지쥐]$/,'Pinotage'],[/^(샤르도네|샤도네이|샤도네)$/,'Chardonnay'],[/^[소쇼]비[뇽뇨]블랑$/,'Sauvignon Blanc'],[/^리슬링$/,'Riesling'],[/^(슈냉|슈넹|쉬냉)블랑$/,'Chenin Blanc'],
 [/^피노(그리|그리지오|그리조)$/,'Pinot Gris / Pinot Grigio'],[/^피노블랑$/,'Pinot Blanc'],[/^게[뷔부]르츠트라미너$/,'Gewürztraminer'],[/^비오니에$/,'Viognier'],[/^세미[용옹]$/,'Sémillon'],[/^마르산$/,'Marsanne'],[/^루산$/,'Roussanne'],
 [/^(뮈스카|모스카토|머스캣|무스카트)$/,'Muscat / Moscato'],[/^알리고테$/,'Aligoté'],[/^베르멘티노$/,'Vermentino'],[/^가르가네가$/,'Garganega'],[/^트레비아노$/,'Trebbiano'],[/^글레라$/,'Glera'],[/^알바리[뇨노]$/,'Albariño'],[/^베르데호$/,'Verdejo'],
 [/^그[뤼루]너벨트리너$/,'Grüner Veltliner'],[/^푸르민트$/,'Furmint'],[/^토론테스$/,'Torrontés'],[/^블라우프랜키[쉬슈]$/,'Blaufränkisch'],[/^츠바이겔트$/,'Zweigelt']];
const plain=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z]/g,'');
const GRAPE_EN={};for(const g of GRAPES){GRAPE_EN[plain(g)]=g;for(const p of g.split(' / '))GRAPE_EN[plain(p)]=g}
function grapeEn(g){const t=g.replace(/\s+/g,'');for(const[rx,en]of GRAPE_KO)if(rx.test(t))return en;return GRAPE_EN[plain(g)]||g}

async function callClaude(content,useWeb,maxTokens){
  const cfg=getCfg();if(!cfg.key)throw{code:'no_key'};
  const msgs=[{role:'user',content}];let text='';const cited=[],found=[];
  for(let round=0;round<3;round++){
    const body={model:cfg.model||DEF.model,max_tokens:maxTokens||3000,messages:msgs};
    if(useWeb)body.tools=[{type:'web_search_20250305',name:'web_search',max_uses:4}];
    let r,j;
    try{
      r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':cfg.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
      j=await r.json();
    }catch(_){throw{code:'network'}}
    if(!r.ok)throw{code:r.status===401?'bad_key':r.status===429?'rate_limited':r.status===404?'bad_model':'api',message:j&&j.error&&j.error.message};
    for(const b of j.content||[]){
      if(b.type==='text'){text+=b.text;for(const c of b.citations||[])if(c.url&&!cited.some(x=>x.url===c.url))cited.push({title:c.title||c.url,url:c.url})}
      else if(b.type==='web_search_tool_result'&&Array.isArray(b.content))for(const x of b.content)if(x.url&&!found.some(y=>y.url===x.url))found.push({title:x.title||x.url,url:x.url});
    }
    if(j.stop_reason!=='pause_turn')break;
    msgs.push({role:'assistant',content:j.content});
  }
  return{text,sources:(cited.length?cited:found).slice(0,5)};
}
function parseJSON(t){
  const m=t.match(/```(?:json)?\s*([\s\S]*?)```/);const src=m?m[1]:t;
  const a=src.indexOf('{'),b=src.lastIndexOf('}');
  if(a<0||b<=a)throw{code:'invalid_json'};
  try{return JSON.parse(src.slice(a,b+1))}catch(_){throw{code:'invalid_json'}}
}

function thumbUrl(id){
  const d=thumbs[id],c=tUrl[id];
  if(!d){if(c){URL.revokeObjectURL(c.u);delete tUrl[id]}return''}
  if(c&&c.d===d)return c.u;
  if(c)URL.revokeObjectURL(c.u);
  try{
    const i=d.indexOf(','),bin=atob(d.slice(i+1)),a=new Uint8Array(bin.length);
    for(let k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);
    const u=URL.createObjectURL(new Blob([a],{type:d.slice(5,i).split(';')[0]||'image/jpeg'}));
    tUrl[id]={d,u};return u;
  }catch(_){return d}
}

function scoreLine(w,all){
  const cs=(Array.isArray(w.critics)?w.critics:[]).filter(c=>c&&c.score>0);
  const fmt=c=>`<span class="sc cr" title="${esc(c.who)}"><i>${esc(all?c.who:(c.abbr||c.who.slice(0,2).toUpperCase()))}</i>${c.max===20?c.score+'/20':c.score}</span>`;
  const top=[...cs].sort((a,b)=>b.score/b.max-a.score/a.max)[0];
  return(all?cs.map(fmt).join(''):top?fmt(top):'')+(w.vivino?`<span class="sc vv" title="Vivino 평점"><i>${all?'Vivino':'★'}</i>${Number(w.vivino).toFixed(1)}${all&&w.vivinoN?` (${Math.round(w.vivinoN).toLocaleString()}명)`:''}</span>`:'');
}

/* ---------- 이름 통일 추천: 같은 빈티지·용량인데 이름 표기만 조금 다른 와인을 찾아, 어느 표기로 맞출지 고르게 한다 ---------- */
const NAME_STOP=new Set(['chateau','ch','domaine','dom','dme','maison','tenuta','bodega','bodegas','weingut','cantina','azienda','agricola','the','de','du','des','la','le','les','di','del','della','et','and','vin','wine','wines']);
const nameTok=w=>[...new Set(String([w.producer,w.name].join(' ')).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9가-힣]+/g,' ').trim().split(' ').filter(t=>t&&!NAME_STOP.has(t)))];
function lev1(a,b){if(a===b)return true;if(Math.abs(a.length-b.length)>1||Math.min(a.length,b.length)<5)return false;let i=0,j=0,d=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++}else{if(++d>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++}}}return d+(a.length-i)+(b.length-j)<=1}
/* 단어 하나가 비슷한지: 한 글자 차이, 긴 단어의 두 글자 차이, 한쪽이 다른 쪽의 앞부분(Roche·Roches, Mont·Montrose) */
function lev(a,b){const m=a.length,n=b.length;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function tokLike(a,b){if(a===b||lev1(a,b))return true;const[s2,l]=a.length<=b.length?[a,b]:[b,a];if(/^[0-9]/.test(s2)||/^[0-9]/.test(l))return false;if(s2.length>=3&&l.startsWith(s2))return true;return s2.length>=7&&l.length-s2.length<=2&&lev(s2,l)<=2}
const NAME_COLOR=/^(rose|rouge|blanc|blancs|noir|noirs|red|white)$/;
function nameSim(a,b,loose){ /* 0~1. 조금이라도 비슷하면 묻는다. 색을 가르는 단어(Rosé·Blanc 등)가 한쪽에만 있을 때만 확실히 다른 와인으로 본다 */
  const ua=a.filter(t=>!b.some(u=>tokLike(t,u))),ub=b.filter(t=>!a.some(u=>tokLike(t,u)));
  if(!loose&&[...ua,...ub].some(t=>NAME_COLOR.test(t)))return 0; /* loose: 라벨로 입고예정을 찾을 때는 한쪽에 빠진 단어가 있어도 후보로 남긴다 */
  const ja=a.join(''),jb=b.join('');
  if(ja===jb||Math.min(ja.length,jb.length)>=6&&(ja.includes(jb)||jb.includes(ja)||lev(ja,jb)<=2))return 1; /* 띄어쓰기만 다르거나 한쪽이 다른 쪽에 통째로 들어 있음 */
  const inter=Math.min(a.length-ua.length,b.length-ub.length),uni=inter+ua.length+ub.length;
  if(inter>=2&&(!ua.length||!ub.length))return 1; /* 짧은 이름의 단어가 긴 이름에 모두 들어 있음 */
  return uni?inter/uni:0;

const spellOf=w=>(w.producer||'')+'\u241F'+(w.name||'');

function sameWine(w){ /* 같은 와인이 여러 항목이면 구매처·가격이 같은 항목, 그다음 최근 항목 */

/* ---------- AI 해설 자동 등록 ----------
   새로 등록한 와인(aiPending)만 대기열에 넣어 한 병씩 처리한다. 이전부터 있던 와인은 건드리지 않는다.
   앱을 닫거나 연결이 끊겨 못 붙인 새 와인은
   앱을 다시 열 때, 인터넷이 돌아올 때, API 키를 저장할 때 자동으로 이어서 처리한다. */
const aiQ=[];let aiBusy=false,aiNow=null,aiBlocked=false;
const AI_STOP=['no_key','bad_key','bad_model','network','rate_limited'];
const needsAi=w=>!!(w&&w.aiPending&&(w.aiTries||0)<3);
const aiStatus=w=>aiNow===w.id?'작성 중':aiQ.includes(w.id)?'대기 중':'';
function refreshDetail(id){const o=$('#sheet [data-detail]');if(o&&(!id||o.dataset.detail===id))openWine(o.dataset.detail)}
function queueAi(id){
  if(!getCfg().key||aiBlocked||navigator.onLine===false)return;
  if(!needsAi(wines.find(x=>x.id===id)))return;
  if(!aiQ.includes(id))aiQ.push(id);
  runAi();
}
function sweepAi(){
  if(!getCfg().key||aiBlocked||navigator.onLine===false)return;
  for(const w of wines)if(needsAi(w)&&!aiQ.includes(w.id))aiQ.push(w.id);
  runAi();
}
async function runAi(){
  if(aiBusy)return;aiBusy=true;
  try{
    while(aiQ.length){
      const id=aiQ[0];aiNow=id;render();refreshDetail(id);
      const code=await enrich(id,true);
      aiNow=null;aiQ.shift();
      if(AI_STOP.includes(code)){
        aiQ.length=0;
        if(code==='network'||code==='rate_limited'){toast('AI 해설을 아직 붙이지 못했습니다. '+aiMsg({code})+' 나중에 자동으로 다시 시도합니다.');if(code==='rate_limited')setTimeout(sweepAi,90000)}
        else{aiBlocked=true;toast('AI 해설을 붙이지 못했습니다. '+aiMsg({code}))}
      }else if(code&&code!=='gone'&&code!=='empty'){
        const w=wines.find(x=>x.id===id);
        if(w)await put('wines',id,{...w,aiTries:(w.aiTries||0)+1,aiErr:aiMsg({code})});
      }
    }
  }finally{aiBusy=false;aiNow=null;render();refreshDetail()}
}

function askNorm(w,changes){
  const out={};

   depth: 0=홈, 1=홈 위에 탭이 한 칸 쌓인 상태, null=홈 없이 다른 탭에서 시작(새로고침·바로가기)해 아직 아래에 홈이 없는 상태 */

function go(tab){
  if(armed&&!backing)closeSheet();
  if(backing){afterBack=()=>go(tab);return} /* 열린 화면을 닫는 중이면 끝난 뒤에 이동 */
  const cur=route();if(tab===cur){render();return}

  else if(tab==='home'&&depth===1)history.back();
  else location.replace('#'+tab);
}

function rootHome(){
  if(depth!=null||route()==='home'||armed||backing)return;
  try{const h=location.hash;history.replaceState(null,'','#home');history.pushState(null,'',h);depth=1;keepDepth()}catch(_){}

/* 예전 방식 시세 정리: 한국 수입 마진을 얹어 추정했던 원화 값을 버리고, 받아 둔 해외 평균가에 실제 환율만 곱한 값으로 바꾼다 */
async function fixOldMarket(){
  const old=wines.filter(w=>w&&(w.marketKRW||w.marketUSD)&&w.marketOrig===undefined);
  if(!old.length)return;
  const fx=old.some(w=>w.marketUSD>0)?await fxKRW('USD'):null;
  let n=0;
  for(const w of old){
    const cur=wines.find(x=>x.id===w.id);if(!cur||cur.marketOrig!==undefined)continue;
    if(cur.marketUSD>0){if(!fx)continue;Object.assign(cur,{marketOrig:cur.marketUSD,marketCur:'USD',marketFx:fx.rate,marketKRW:Math.round(cur.marketUSD*fx.rate),marketNote:'',marketSrc:cur.marketSrc||''})}
    else Object.assign(cur,{marketOrig:null,marketCur:'',marketNote:''}); /* 해외가 없이 추정 원화만 있던 경우: 추정 설명은 지우고 다시 받기를 기다린다 */
    n++;
  }
  if(n){persist();render();refreshDetail()}
}
fixOldMarket();
